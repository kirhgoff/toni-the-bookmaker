[project]
name = "toni"
version = "0.1.0"
description = "CLI tool to generate audiobooks from PDF/text files using TTS models"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pymupdf>=1.24.0",
    "pydub>=0.25.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
pocket = ["pocket-tts"]
kani = ["kani-tts-2", "transformers>=4.50.0"]

[project.scripts]
toni = "toni.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toni"]

[dependency-groups]
dev = []

[tool.uv]
conflicts = [
    [
        { extra = "pocket" },
        { extra = "kani" },
    ],
]
