[project]
name = "toni"
version = "0.1.0"
description = "CLI tool to generate audiobooks from PDF/text files using TTS models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pymupdf>=1.24.0",
    "pydub>=0.25.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
pocket = ["pocket-tts"]
kani = ["kani-tts-2", "transformers>=4.50.0"]
omni = [
    "omnivoice>=0.2.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "soundfile>=0.12.1",
]
espeech = [
    "f5-tts>=1.1.22",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "soundfile>=0.12.1",
    "toni[stress]",
]
qwen = [
    "qwen-tts",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "soundfile>=0.12.1",
]
stress = ["silero-stress"]

[project.scripts]
toni = "toni.cli:main"
toni-transcribe = "toni.transcribe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toni"]

[dependency-groups]
dev = []

[tool.uv]
# torchcodec 0.10 cannot load Homebrew ffmpeg 9 on macOS and transformers imports it whenever installed
override-dependencies = ["torchcodec ; sys_platform != 'darwin'"]
conflicts = [
    [
        { extra = "pocket" },
        { extra = "kani" },
        { extra = "omni" },
        { extra = "espeech" },
        { extra = "qwen" },
    ],
]
